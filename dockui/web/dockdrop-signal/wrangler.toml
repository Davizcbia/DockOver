# DockDrop signalling relay. Deploy: npx wrangler login, then npx wrangler deploy (from this folder).
name = "dockdrop-signal"
main = "src/index.js"
compatibility_date = "2025-01-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]  # SQLite-backed Durable Objects are on the free plan
